name: exam-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exam_ai
      POSTGRES_USER: exam_ai
      POSTGRES_PASSWORD: exam_ai
    ports: ["127.0.0.1:5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_ai -d exam_ai"]
      interval: 5s
      timeout: 5s
      retries: 10
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ../backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_PATH: /data/exam_ai.db
      DATABASE_URL: postgresql+psycopg://exam_ai:exam_ai@postgres:5432/exam_ai
      UPLOAD_DIR: /data/uploads
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-exam_documents}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-100}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - app_data:/data
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  qdrant_data:
  app_data:
